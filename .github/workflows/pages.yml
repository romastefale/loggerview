name: Publicar página
# Publica só a página (index.html e slug.js) no GitHub Pages.
# Requer Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: [index.html, slug.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp index.html slug.js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v4
