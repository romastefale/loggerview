name: Extrair
# A página dispara este workflow com o link e um identificador de pedido;
# o run-name carrega o pedido para a página achar a execução dela.
run-name: extrair ${{ inputs.pedido }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: Link da publicação
        required: true
        type: string
      pedido:
        description: Identificador do pedido (a página preenche)
        required: false
        type: string
        default: manual

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - name: Extrair
        env:
          URL: ${{ inputs.url }}
        run: node scripts/extrair.mjs "$URL"

      - name: Gravar na biblioteca
        env:
          URL: ${{ inputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add biblioteca
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "biblioteca: $URL"
          # Outra extração pode ter gravado antes; traz e tenta de novo.
          for espera in 3 6 12; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep "$espera"
          done
          echo "::error::Não consegui gravar na biblioteca."
          exit 1
